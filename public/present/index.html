<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Presentations | InsightMatches</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font: 16px/1.5 system-ui, sans-serif;
      color: #102238;
      background: #fff;
    }
    main { width: min(100%, 440px); }
    img { display: block; width: 155px; height: auto; }
    h1 { margin: 24px 0 20px; font-size: 36px; letter-spacing: -.04em; }
    nav { display: grid; gap: 10px; }
    a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid #dce5ed;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { background: #f3f8fc; border-color: #8db4ce; }
    a:focus-visible { outline: 2px solid #0873a5; outline-offset: 3px; }
    a span { color: #0873a5; }
  </style>
</head>
<body>
  <main>
    <img src="/deck-assets/insightmatches-original.png" alt="InsightMatches">
    <h1>Presentations</h1>
    <nav aria-label="Presentation decks">
      <a href="/deck/">Main InsightMatches deck <span aria-hidden="true">→</span></a>
      <a href="/printed-deck/">Printed deck <span aria-hidden="true">→</span></a>
      <a href="/cit/">Global CIT deck <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
