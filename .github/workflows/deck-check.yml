name: Deck integration checks
on:
  pull_request:
    paths:
      - 'deck/**'
      - 'public/deck-assets/**'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'scripts/check-deck.mjs'
      - 'scripts/check-deck-currency.mjs'
      - '.github/workflows/deck-check.yml'
permissions:
  contents: read
jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint deck
      - run: npm run build
      - run: node scripts/check-deck.mjs
      - run: node scripts/check-deck-currency.mjs
